<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novazova — Users</title><style>body{font-family:Arial,sans-serif;background:#f5f2ec;margin:0;padding:30px;color:#171717}h1{margin:0 0 8px}.muted{color:#777}.wrap{max-width:1200px;margin:auto}.card{background:white;border:1px solid #ddd;padding:20px;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:1px}.count{font-size:28px;font-weight:700;margin-top:10px}.refresh{margin:15px 0;padding:10px 15px;cursor:pointer}</style></head><body><div class="wrap"><h1>Novazova Users</h1><div class="muted">Live user register. New sign-ups are saved to data/users.csv and appear here automatically every 5 seconds.</div><div class="count" id="count">0 users</div><button class="refresh" onclick="load()">Refresh now</button> <a class="refresh" href="/api/users.csv" download>Download CSV</a><div class="card"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Age</th><th>Registered</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>async function load(){try{const isLocalDevOnOtherPort=(location.hostname==='localhost'||location.hostname==='127.0.0.1')&&location.port!=='3000'&&location.port!=='';const base=isLocalDevOnOtherPort?'http://localhost:3000':'';const r=await fetch(base+'/api/users',{cache:'no-store',credentials:'include'}); if(!r.ok) throw new Error();const d=await r.json();document.getElementById('count').textContent=d.users.length+' user'+(d.users.length===1?'':'s');document.getElementById('rows').innerHTML=d.users.slice().reverse().map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${esc(u.age)}</td><td>${new Date(u.created_at).toLocaleString()}</td></tr>`).join('')}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan=5>Could not load users. Make sure the app server is running.</td></tr>'}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,5000)</script></body></html>
